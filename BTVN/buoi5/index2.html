<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Tạo hồ sơ cá nhân</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <h2>Tạo hồ sơ cá nhân</h2>
    <form id="hosoForm">
        <label>Họ tên:</label><br>
        <input type="text" id="ten" required><br><br>

        <label>Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label>Số điện thoại:</label><br>
        <input type="tel" id="sdt" required><br><br>

        <label>Địa chỉ:</label><br>
        <input type="text" id="diachi" required><br><br>

        <label>Ảnh đại diện (URL):</label><br>
        <input type="url" id="anh" required><br><br>

        <button type="submit">Lưu thông tin</button>
    </form>

    <hr>

    <h2>Hồ sơ cá nhân</h2>
    <div id="hienThiHoSo"></div>

    <script src="./js/script2.js"></script>
</body>

</html>
