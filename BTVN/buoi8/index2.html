<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2qxw3rv5t6byh7uj8ik9</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style2.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">nhà Hàng</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#datban">Đặt bàn</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#gio">giờ trống</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-4" id="gio">
      <h2 class="text-center mb-3">giờ đặt bàn có sẵn</h2>
      <div class="row row-cols-2 row-cols-md-4 g-3">
        <div class="col"><div class="time-slot">10:00</div></div>
        <div class="col"><div class="time-slot">11:30</div></div>
        <div class="col"><div class="time-slot">13:00</div></div>
        <div class="col"><div class="time-slot">15:00</div></div>
        <div class="col"><div class="time-slot">17:30</div></div>
        <div class="col"><div class="time-slot">19:00</div></div>
        <div class="col"><div class="time-slot">20:30</div></div>
        <div class="col"><div class="time-slot">22:00</div></div>
      </div>
    </div>

    <div class="container my-4" id="datban">
      <h2 class="text-center mb-3">đặt bàn</h2>
      <form id="reservationForm">
        <div class="mb-3">
          <label>email:</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label>số điện thoại:</label>
          <input type="tel" class="form-control" id="phone" required />
        </div>
        <div class="mb-3">
          <label>ngày:</label>
          <input type="date" class="form-control" id="date" required />
        </div>
        <div class="mb-3">
          <label>giờ:</label>
          <input type="time" class="form-control" id="time" required />
        </div>
        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#confirmModal"
        >
          xác nhận
        </button>
      </form>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">xác nhận đặt bàn</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>email:</strong> <span id="confirmEmail"></span></p>
            <p>
              <strong>số điện thoại:</strong> <span id="confirmPhone"></span>
            </p>
            <p><strong>ngày:</strong> <span id="confirmDate"></span></p>
            <p><strong>giờ:</strong> <span id="confirmTime"></span></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              chỉnh sửa
            </button>
            <button
              type="submit"
              class="btn btn-success"
              form="reservationForm"
            >
              gửi
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script2.js"></script>
    <script src="./js/nav.js"></script>
  </body>
</html>
